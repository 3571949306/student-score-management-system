<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无权访问 - 学生成绩管理系统</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <nav class="top-nav">
        <div class="nav-container">
            <a th:href="@{/user/loginSuccess}" class="nav-brand">
                <div class="brand-icon">S</div>
                <span>成绩管理系统</span>
            </a>
            <div class="nav-user">
                <div class="user-badge">
                    <div class="user-avatar" th:text="${#strings.substring(username,0,1)}">T</div>
                    <span th:text="${username}">user</span>
                </div>
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="logout-btn">退出</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="page-content">
        <div class="card result-panel">
            <div class="welcome-text">
                <h3>⛔ 无权访问</h3>
                <p><span th:text="${username}">当前用户</span>，您没有权限访问该页面。</p>
                <p>当前权限：<span th:text="${roles}">ROLE_STUDENT</span></p>
            </div>
            <div class="links" style="max-width:400px;">
                <a th:href="@{/scores}" class="link-card">
                    <div class="icon">📊</div>
                    <span>返回成绩页面</span>
                </a>
                <a th:href="@{/user/loginSuccess}" class="link-card">
                    <div class="icon">🏠</div>
                    <span>返回首页</span>
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
