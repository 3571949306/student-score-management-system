<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 学生成绩管理系统</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="logo">S</div>
            <h1>学生成绩管理系统</h1>
            <p>欢迎回来，请登录您的账号</p>
        </div>

        <div th:if="${param.error}" class="login-alert">用户名或密码错误，请重试</div>
        <div th:if="${param.logout}" class="login-message">您已安全退出</div>

        <form class="login-form" th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="username" autofocus>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password">
            </div>
            <div class="login-actions">
                <button type="submit" class="btn btn-primary" style="flex:1;">登 录</button>
                <button type="reset" class="btn btn-secondary">重置</button>
            </div>
        </form>

        <div class="login-hint">
            <strong>演示账号</strong>
            <p>管理员：<code>admin / 123</code></p>
            <p>老师：<code>teacher / 123</code></p>
            <p>学生：<code>李明 / 123</code></p>
        </div>
    </div>
</div>
</body>
</html>
